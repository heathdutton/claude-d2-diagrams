# Keeps ./diagrams in step with the code: when a push to the default branch (or the weekly run)
# finds drift since diagrams/manifest.json was stamped, Claude refreshes the diagrams and the
# result lands as a pull request for review.
name: Refresh diagrams

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A refresh already under way finishes; GitHub keeps one run queued behind it.
concurrency:
  group: refresh-diagrams
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Drift is measured from the manifest commit, which a shallow clone doesn't have.
          fetch-depth: 0

      # The same drift rule as the plugin's status.sh, inlined so an up-to-date repo costs no
      # Claude run. While a refresh PR is open its manifest is the newer stamp, so pushes that
      # don't touch the sources again leave that PR alone.
      - name: Check for drift
        id: drift
        run: |
          manifest=$(git show origin/diagrams/refresh:diagrams/manifest.json 2>/dev/null || cat diagrams/manifest.json 2>/dev/null || true)
          if [ -z "$manifest" ]; then
            echo "::notice::No diagrams/manifest.json: run /d2:diagram once locally and commit the result."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(jq -r '.commit // empty' <<<"$manifest")
          # A squash or rebase merge drops the stamped commit: measure from where the manifest landed.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git log -1 --format=%H -- diagrams/manifest.json)
          fi
          specs=()
          while IFS= read -r s; do
            case $s in :*) specs+=("$s") ;; *) specs+=(":(glob)$s") ;; esac
          done < <(jq -r '.sources[]' <<<"$manifest")
          changed=$(git diff --name-only "$base" HEAD -- "${specs[@]}" ':(exclude)diagrams/' \
            ':(exclude,glob)**/node_modules/**' ':(exclude,glob)**/vendor/**')
          if [ -z "$changed" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Changed since %s:\n%s\n' "${base:0:7}" "$changed"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install D2
        if: steps.drift.outputs.stale == 'true'
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - uses: anthropics/claude-code-action@v1
        if: steps.drift.outputs.stale == 'true'
        env:
          # A headless run stops waiting on background agents after ten minutes; a big repo's
          # verifier can take longer.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
        with:
          # Or claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} (from `claude setup-token`).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/heathdutton/claude-d2-diagrams.git
          plugins: d2@claude-d2-diagrams
          prompt: /d2:diagram
          # Claude only edits files here; the PR step below does the GitHub side.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The runner is ephemeral and the job only reads this repo, so its subagents get the file
          # and shell tools they need without per-command rules.
          claude_args: --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent"

      - uses: peter-evans/create-pull-request@v8
        if: steps.drift.outputs.stale == 'true'
        with:
          branch: diagrams/refresh
          title: Refresh diagrams
          commit-message: refresh diagrams from the latest infrastructure and service changes
          body: Regenerated by `/d2:diagram` after the sources in `diagrams/manifest.json` changed.
          add-paths: |
            diagrams/**
            README.md
          delete-branch: true
